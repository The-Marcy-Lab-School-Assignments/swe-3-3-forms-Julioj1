<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tech Summit Form</title>
</head>
<body>
    <!-- The page's title -->
<h1>NYC Tech Summit 2026</h1>
<p class="date">March 15, 2026 | 9:00 AM - 5:00 PM | Manhattan Conference Center</p>

<form>
  <!-- The form's title -->
  <h2>Event RSVP</h2>

  <!-- Every label/input pair gets a div container -->
   <div class="form-row">
        <div>
            <label for="first-name">First name</label>
            <input type="text" id="first-name"/>
        </div>
        <div>
            <label for="last-name">Last name</label>
            <input type="text" id="last-name"/>
        </div>
  </div>

  <div class="form-row">
    <div>
        <label for="email">Email</label>
        <input type="text" id="email"/>
    </div>

    <div>
        <label for="number-of-tickets">Number of Tickets</label>
        <input type="text" id="number-of-tickets" min="1"/>
    </div>
  </div>

    <fieldset class="lunch-group">
        <legend>Lunch Preference</legend>

        <label>
            <input type="radio" name="lunch" value="chicken">
            chicken
        </label>

        <label>
            <input type="radio" name="lunch" value="fish">
            Fish
        </label>

        <label>
            <input type="radio" name="lunch" value="vegetarian">
            Vegetarian
        </label>
    </fieldset>

  <fieldset class="workshop-group">
    <legend>Select Workshop Sessions (Check all that apply)</legend>

    <label><input type="checkbox">Session 1</label>
    <label><input type="checkbox">Session 2</label>
    <label><input type="checkbox">Session 3</label>
    <label><input type="checkbox">Session 4</label>
    <label><input type="checkbox">Session 5</label>
  </fieldset>

  <div>
    <label for="requests">Special Requests or Notes</label>
    <textarea id="requests" placeholder="Dietary restrictions, accessibility needs, questions, etc."></textarea>
  </div>

  <button type="submit">Complete RSVP</button>
</form>
</body>
</html>
