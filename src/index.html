<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tech Summit Form</title>
</head>
<body>
    <header>
        <!-- The page's title -->
        <h1>NYC Tech Summit 2026</h1>
        <p class="date">March 15, 2026 | 9:00 AM - 5:00 PM | Manhattan Conference Center</p>
    </header>

    <main>
        <form>
            <!-- The form's title -->
            <h2>Event RSVP</h2>

            <div class="form-row">
                <!-- Every label/input pair gets a div container -->
                <div>
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first-name" />
                </div>
                <div>
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name" />
                </div>
            </div>

            <div class="form-row">
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" />
                </div>
                <div>
                    <label for="number-of-tickets">Number of Tickets</label>
                    <input type="number" id="number-of-tickets" name="number-of-tickets" min="1" max="10" />
                </div>
            </div>

            <fieldset class="lunch-group">
                <legend>Lunch Preference</legend>

                <label>
                    <input type="radio" name="lunch" value="chicken">
                    Chicken
                </label>
                <label>
                    <input type="radio" name="lunch" value="fish">
                    Fish
                </label>
                <label>
                    <input type="radio" name="lunch" value="vegetarian">
                    Vegetarian
                </label>
            </fieldset>

            <fieldset class="workshop-group">
                <legend>Select Workshop Sessions (Check all that apply)</legend>

                <label><input type="checkbox" name="workshop" value="session-1"> Session 1</label>
                <label><input type="checkbox" name="workshop" value="session-2"> Session 2</label>
                <label><input type="checkbox" name="workshop" value="session-3"> Session 3</label>
                <label><input type="checkbox" name="workshop" value="session-4"> Session 4</label>
                <label><input type="checkbox" name="workshop" value="session-5"> Session 5</label>
            </fieldset>

            <div>
                <label for="requests">Special Requests or Notes</label>
                <textarea id="requests" name="requests" placeholder="Dietary restrictions, accessibility needs, questions, etc."></textarea>
            </div>

            <button type="submit">Complete RSVP</button>
        </form>
    </main>

    <footer>
        <p>NYC Tech Summit 2026 &mdash; Manhattan Conference Center</p>
    </footer>
</body>
</html>
